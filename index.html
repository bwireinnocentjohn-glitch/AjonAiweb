<!doctype html>
<html lang="en">
<head>
 <link rel="manifest" href="manifest.json">
<meta charset="utf-8"/>

<meta name="theme-color" content="#000000"/>
<title>Ajon AI</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;
    font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
  #app{position:fixed;left:0;top:0;right:0;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;background:#000;overflow:hidden}
  #hdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    background:#000;padding:12px 14px 10px;
    padding-top:calc(env(safe-area-inset-top,0px) + 30px);
    border-bottom:1px solid #1a1a1a}
  .av{width:34px;height:34px;border-radius:50%;background:#25D366;color:#000;
    font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
  .t{flex:1;min-width:0}
  .t b{font-size:14px;letter-spacing:.4px}
  .t small{display:block;font-size:11px;color:#8a8a8a;margin-top:2px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#25D366;margin-right:5px;vertical-align:middle}
  #clr{flex:0 0 auto;border:1px solid #2a2a2a;background:#000;color:#fff;
    font-size:11px;font-weight:700;border-radius:20px;padding:6px 11px}

  #tabs{flex:0 0 auto;display:flex;background:#000;border-bottom:1px solid #1a1a1a}
  #tabs button{flex:1;background:none;border:0;color:#888;padding:10px 4px;
    font-size:12px;font-weight:700;cursor:pointer;
    border-bottom:2px solid transparent;letter-spacing:.3px}
  #tabs button.on{color:#fff;border-bottom-color:#25D366}
  #tabs button:active{background:#111}

  .view{display:none;flex-direction:column;flex:1 1 auto;min-height:0}
  .view.on{display:flex}

  #chat{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:10px 12px;display:flex;flex-direction:column;gap:6px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .m{max-width:86%;padding:7px 11px;border-radius:13px;font-size:14px;
    line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;
    animation:pop .12s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .m.u{align-self:flex-end;background:#25D366;color:#000;border-top-right-radius:3px}
  .m.a{align-self:flex-start;background:#1a1a1a;color:#fff;border-top-left-radius:3px}
  .m.s{align-self:center;background:#0d0d0d;color:#888;font-size:11px;
    border-radius:10px;text-align:center;max-width:92%}
  #bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    background:#000;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;
    padding:8px 10px}
  #bar input{flex:1;min-width:0;border:0;outline:0;background:#1a1a1a;color:#fff;
    border-radius:22px;padding:12px 16px;font-size:16px}
  #bar input::placeholder{color:#666}
  #bar button{flex:0 0 auto;border:0;background:#25D366;color:#000;
    border-radius:22px;padding:0 18px;height:44px;font-size:14px;font-weight:800}
  #bar button:active{opacity:.8}
  #pad{flex:0 0 26%;background:#000}
  #pad small{display:block;text-align:center;color:#1a1a1a;
    font-size:10px;margin-top:14px;letter-spacing:1px}

  #view-learn{overflow-y:auto;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
  .card{background:#111;border:1px solid #1f1f1f;border-radius:12px;
    padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px;color:#25D366;letter-spacing:.4px}
  .card p{margin:0 0 10px;font-size:12px;color:#888;line-height:1.45}
  .card input,.card textarea{width:100%;background:#1a1a1a;border:1px solid #262626;
    color:#fff;border-radius:8px;padding:10px 12px;font-size:14px;
    font-family:inherit;outline:none;margin-bottom:8px;resize:vertical}
  .card textarea{min-height:70px}
  .btn{display:inline-block;border:0;background:#25D366;color:#000;font-weight:800;
    font-size:13px;padding:10px 16px;border-radius:20px;cursor:pointer;margin-right:6px}
  .btn.alt{background:#1a1a1a;color:#fff;border:1px solid #333}
  .btn.warn{background:#c0392b;color:#fff}
  .btn:active{opacity:.8}
  .lock-note{color:#888;font-size:12px;margin-top:8px}
  .lock-note.err{color:#e74c3c}
  .item{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:8px;
    padding:10px;margin-bottom:8px;font-size:13px;line-height:1.4}
  .item .q{color:#25D366;font-weight:700;margin-bottom:4px}
  .item .a{color:#ddd;margin-bottom:8px;white-space:pre-wrap;word-wrap:break-word}
  .item button{background:#2a1212;color:#ff6b6b;border:1px solid #3d1a1a;
    border-radius:16px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
  .empty{color:#555;font-size:12px;text-align:center;padding:14px}
  .hidden{display:none!important}

  #view-calc{padding:0;display:flex;flex-direction:column}
  .calc-display{background:#0a0a0a;border-bottom:1px solid #1a1a1a;
    padding:18px 16px;font-family:monospace;text-align:right;
    min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
  .calc-expr{color:#888;font-size:14px;min-height:18px;
    overflow-x:auto;white-space:nowrap}
  .calc-result{color:#fff;font-size:34px;font-weight:700;margin-top:6px;
    overflow-x:auto;white-space:nowrap}
  .calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);
    gap:1px;background:#1a1a1a;padding:1px;min-height:0}
  .calc-grid button{background:#0d0d0d;color:#fff;border:0;
    font-size:22px;font-weight:600;cursor:pointer;min-height:52px}
  .calc-grid button:active{background:#1f1f1f}
  .calc-grid button.op{color:#25D366}
  .calc-grid button.eq{background:#25D366;color:#000}
  .calc-grid button.eq:active{background:#1ea952}
  .calc-grid button.clear{color:#e74c3c}
  .calc-grid button.zero{grid-column:span 2}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="av">A</div>
    <div class="t">
      <b>AJON AI</b>
      <small><span class="dot"></span><span id="st">Ready</span></small>
    </div>
    <button id="clr" type="button">Clear</button>
  </div>

  <div id="tabs">
    <button data-tab="chat" class="on" type="button">💬 Chat</button>
    <button data-tab="learn" type="button">📚 Learn</button>
    <button data-tab="calc" type="button">🔢 Calc</button>
  </div>

  <div id="view-chat" class="view on">
    <div id="chat"></div>
    <form id="bar" autocomplete="off" onsubmit="return false;">
      <input id="q" type="text" enterkeyhint="send" placeholder="Say something…"
             autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button type="submit">Send</button>
    </form>
    <div id="pad"><small>AJON AI · OFFLINE</small></div>
  </div>

  <div id="view-learn" class="view">
    <div id="learnLocked">
      <div class="card">
        <h3>🔒 Learn tab locked</h3>
        <p>Enter the password to teach Ajon AI. Only the maker knows it.</p>
        <input id="pwd" type="password" placeholder="Password" autocomplete="off"/>
        <button class="btn" id="unlockBtn" type="button">Unlock</button>
        <div class="lock-note" id="lockMsg"></div>
      </div>
    </div>

    <div id="learnUnlocked" class="hidden">
      <div class="card">
        <h3>📚 Teach Ajon AI</h3>
        <p>Type a question and the answer. Ajon will remember it forever on this phone.</p>
        <input id="newQ" type="text" placeholder="Question (e.g. what is your name)"/>
        <textarea id="newA" placeholder="Answer (e.g. My name is Ajon AI)"></textarea>
        <button class="btn" id="saveBtn" type="button">Save</button>
        <button class="btn alt" id="lockBtn" type="button">🔒 Lock</button>
        <div class="lock-note" id="saveMsg"></div>
      </div>

      <div class="card">
        <h3>📋 Learned items (<span id="learnCount">0</span>)</h3>
        <div id="learnedList"></div>
        <div style="margin-top:10px">
          <button class="btn alt" id="exportBtn" type="button">📤 Export all</button>
          <button class="btn alt" id="importBtn" type="button">📥 Import</button>
        </div>
        <div class="lock-note" id="ioMsg"></div>
        <textarea id="ioBox" placeholder="Exported JSON appears here. Paste JSON here to import, then tap Import." style="margin-top:10px;min-height:90px;display:none"></textarea>
        <button class="btn alt hidden" id="doImportBtn" type="button" style="margin-top:6px">✅ Confirm import</button>
      </div>
    </div>
  </div>

  <div id="view-calc" class="view">
    <div class="calc-display">
      <div class="calc-expr" id="calcExpr">0</div>
      <div class="calc-result" id="calcResult"></div>
    </div>
    <div class="calc-grid" id="calcGrid">
      <button class="clear" data-k="C" type="button">C</button>
      <button class="op" data-k="←" type="button">←</button>
      <button class="op" data-k="%" type="button">%</button>
      <button class="op" data-k="/" type="button">÷</button>
      <button data-k="7" type="button">7</button>
      <button data-k="8" type="button">8</button>
      <button data-k="9" type="button">9</button>
      <button class="op" data-k="*" type="button">×</button>
      <button data-k="4" type="button">4</button>
      <button data-k="5" type="button">5</button>
      <button data-k="6" type="button">6</button>
      <button class="op" data-k="-" type="button">−</button>
      <button data-k="1" type="button">1</button>
      <button data-k="2" type="button">2</button>
      <button data-k="3" type="button">3</button>
      <button class="op" data-k="+" type="button">+</button>
      <button class="zero" data-k="0" type="button">0</button>
      <button data-k="." type="button">.</button>
      <button class="eq" data-k="=" type="button">=</button>
    </div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

/* ============ KEYBOARD FIX ============ */
function fit(){
  var vv=window.visualViewport,a=$('app');
  if(!a)return;
  a.style.height=(vv?vv.height:window.innerHeight)+'px';
  a.style.top=(vv?vv.offsetTop:0)+'px';
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',fit);
  visualViewport.addEventListener('scroll',fit);
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,120)});

function msg(role,text){
  var c=$('chat'),d=document.createElement('div');
  d.className='m '+role;d.textContent=text;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function esc(s){
  return String(s||'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ NORMALIZE ============ */
var CONTRACTIONS=[
  [/\bwhat's\b/g,'what is'],[/\bit's\b/g,'it is'],[/\bi'm\b/g,'i am'],
  [/\byou're\b/g,'you are'],[/\bdon't\b/g,'do not'],[/\bcan't\b/g,'can not'],
  [/\bwon't\b/g,'will not'],[/\bdidn't\b/g,'did not'],[/\bdoesn't\b/g,'does not'],
  [/\bisn't\b/g,'is not'],[/\baren't\b/g,'are not'],[/\bwe're\b/g,'we are'],
  [/\bthey're\b/g,'they are'],[/\bthat's\b/g,'that is'],[/\bthere's\b/g,'there is'],
  [/\bhasn't\b/g,'has not'],[/\bhaven't\b/g,'have not'],[/\bwasn't\b/g,'was not'],
  [/\bweren't\b/g,'were not'],[/\bwouldn't\b/g,'would not'],[/\bshouldn't\b/g,'should not'],
  [/\bcouldn't\b/g,'could not']
];
function norm(s){
  var x=String(s||'').toLowerCase();
  for(var i=0;i<CONTRACTIONS.length;i++) x=x.replace(CONTRACTIONS[i][0],CONTRACTIONS[i][1]);
  return x.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
var STOP=new Set(['the','a','an','of','in','on','to','and','or','for','with',
  'is','are','was','were','be','by','at','it','this','that','from','as',
  'do','does','did','my','me','i','you','your','we','they','he','she']);
function sigWords(s){
  return norm(s).split(' ').filter(function(w){ return w.length>1 && !STOP.has(w); });
}

function intent(text){

  if(/^(tell me a story|tell a story|tell me story|story about|story of|a story|give me a story|i want a story|share a story|another story|one more story)/.test(t)) return 'story';

function findStory(text){
  var t=norm(text);
  var inputWords=t.split(' ').filter(function(w){return w.length>3});
  var best=null,bestScore=0;
  for(var i=0;i<STORIES.length;i++){
    var titleWords=STORIES[i].t.split(' ').filter(function(w){return w.length>3});
    var score=0;
    for(var k=0;k<inputWords.length;k++){
      if(titleWords.indexOf(inputWords[k])>=0) score+=2;
    }
    if(t.indexOf(STORIES[i].t)>=0) score+=10;
    if(score>bestScore){ bestScore=score; best=STORIES[i]; }
  }
  if(bestScore>=2) return best;
  return null;
}

  }
  return null;
}

}

/* ============ LEVENSHTEIN ============ */
function lev(a,b){
  if(a===b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  var prev=new Array(b.length+1),cur=new Array(b.length+1);
  for(var j=0;j<=b.length;j++) prev[j]=j;
  for(var i=1;i<=a.length;i++){
    cur[0]=i;
    for(var j=1;j<=b.length;j++){
      var cost=a.charAt(i-1)===b.charAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
    }
    var t=prev;prev=cur;cur=t;
  }
  return prev[b.length];
}

/* ============ DICTIONARY LOOKUP ============ */
var DICT_PREFIX=['what is a ','what is an ','what is the ','what is ',
                 'what are ','whats ','define ','definition of ',
                 'meaning of ','the meaning of ','tell me about ',
                 'explain the ','explain ','describe '];

function lookupWord(w){
  if(DICT.has(w)) return {word:w, def:DICT.get(w)};
  if(SYN_REV.has(w)){
    var c=SYN_REV.get(w);
    if(DICT.has(c)) return {word:c, def:DICT.get(c), alt:w};
  }
  if(w.length>=4){
    var best=null, bl=99;
    DICT.forEach(function(def,word){
      if(Math.abs(word.length-w.length)>2) return;
      var d=lev(w,word);
      if(d<bl){ bl=d; best=word; }
    });
    if(best && bl<=1) return {word:best, def:DICT.get(best), typo:w};
  }
  return null;
}

function dictLookup(text){
  var t=norm(text);
  if(!t) return null;
  var w=t;
  for(var i=0;i<DICT_PREFIX.length;i++){
    if(t.indexOf(DICT_PREFIX[i])===0){
      w=t.slice(DICT_PREFIX[i].length).trim();
      break;
    }
  }
  var hit=lookupWord(w);
  if(hit) return hit;
  var w2=w.replace(/^(a|an|the|some|my|your)\s+/,'').trim();
  hit=lookupWord(w2);
  if(hit) return hit;
  var ws=w.split(' ').filter(Boolean);
  for(var i=ws.length-1;i>=0;i--){
    var cand=ws[i];
    hit=lookupWord(cand);
    if(hit) return hit;
    if(cand.length>3 && cand.slice(-1)==='s'){
      hit=lookupWord(cand.slice(0,-1));
      if(hit) return hit;
    }
    if(cand.length>4 && cand.slice(-3)==='ies'){
      hit=lookupWord(cand.slice(0,-3)+'y');
      if(hit) return hit;
    }
    if(cand.length>4 && cand.slice(-3)==='ing'){
      var base=cand.slice(0,-3);
      hit=lookupWord(base)||lookupWord(base+'e');
      if(hit) return hit;
      if(base.length>2 && base.slice(-1)===base.slice(-2,-1)){
        hit=lookupWord(base.slice(0,-1));
        if(hit) return hit;
      }
    }
  }
  return null;
}

function factsLookup(text){
  var t=norm(text);
  if(!t) return null;
  var best=null, bs=0;
  for(var i=0;i<FACTS.length;i++){
    var q=FACTS[i].q;
    if(t===q) return FACTS[i];
    if(t.indexOf(q)>=0 || q.indexOf(t)>=0){
      var score=Math.min(t.length,q.length);
      if(score>bs){ bs=score; best=FACTS[i]; }
    }
  }
  return best;
}

/* ============ CALCULATOR ENGINE ============ */
function calculate(expr){
  if(expr==null) return null;
  var clean=String(expr)
    .replace(/[×xX]/g,'*')
    .replace(/÷/g,'/')
    .replace(/[,\s]/g,'');
  if(!clean||clean.length>80) return null;
  if(!/^[0-9+\-*/%().^]+$/.test(clean)) return null;
  if(!/[+\-*/^%]/.test(clean)) return null;
  try{
    var js=clean.replace(/\^/g,'**');
    var r=Function('"use strict";return ('+js+');')();
    if(typeof r!=='number'||!isFinite(r)) return null;
    return Math.round(r*1e10)/1e10;
  }catch(e){ return null; }
}

function tryMath(text){
  var raw=String(text||'').toLowerCase();

  var m=raw.match(/(\d+(?:\.\d+)?)\s*(?:percent|%)\s*of\s*(\d+(?:\.\d+)?)/);
  if(m){
    var p=(parseFloat(m[1])/100)*parseFloat(m[2]);
    return {label:m[1]+'% of '+m[2], result:Math.round(p*1e10)/1e10};
  }

  m=raw.match(/square\s*root\s*of\s*(\d+(?:\.\d+)?)/);
  if(m){
    var s=Math.sqrt(parseFloat(m[1]));
    return {label:'√'+m[1], result:Math.round(s*1e10)/1e10};
  }

  m=raw.match(/(\d+(?:\.\d+)?)\s*squared/);
  if(m){ var n=parseFloat(m[1]); return {label:m[1]+'²', result:n*n}; }

  m=raw.match(/(\d+(?:\.\d+)?)\s*cubed/);
  if(m){ var n2=parseFloat(m[1]); return {label:m[1]+'³', result:n2*n2*n2}; }

  var t=raw
    .replace(/\bplus\b/g,'+')
    .replace(/\badd(?:ed to)?\b/g,'+')
    .replace(/\bminus\b/g,'-')
    .replace(/\bsubtract(?:ed from)?\b/g,'-')
    .replace(/\btimes\b/g,'*')
    .replace(/\bmultiplied by\b/g,'*')
    .replace(/\bmultiply\b/g,'*')
    .replace(/\bdivided by\b/g,'/')
    .replace(/\bdivide\b/g,'/')
    .replace(/\bwhat is\b/g,'')
    .replace(/\bwhats\b/g,'')
    .replace(/\bcalculate\b/g,'')
    .replace(/\bequals?\b/g,'')
    .replace(/\bthe answer to\b/g,'')
    .replace(/[?]/g,'')
    .replace(/=\s*$/,'');

  if(!/\d/.test(t)) return null;
  if(!/[+\-*/^%]/.test(t)) return null;

  var result=calculate(t);
  if(result===null) return null;
  return {label:t.trim(), result:result};
}

/* ============ WORD PROBLEM SOLVER ============ */
function solveWordProblem(text){
  var raw = String(text||'').toLowerCase().replace(/,/g,'');
  var nums = raw.match(/\d+(?:\.\d+)?/g);
  if(!nums || nums.length < 2) return null;
  nums = nums.map(parseFloat);

  var storyWords = ['has','have','had','gives','gave','gets','got','buys','bought',
                    'sells','sold','remains','remain','left','total','each','every',
                    'per','altogether','spent','earned','costs','cost','divide',
                    'share','shared','split','among','between','younger','older',
                    'pays','paid','ate','eats','lost','found','adds','added'];
  var hasStory = false;
  for(var i=0;i<storyWords.length;i++){
    if(new RegExp('\\b'+storyWords[i]+'\\b').test(raw)){ hasStory = true; break; }
  }
  if(!hasStory) return null;

  var m = raw.match(/(\d+(?:\.\d+)?)[^\d]*(?:divided|shared|split|divide|share)\s*(?:among|between|into)\s*(\d+(?:\.\d+)?)/);
  if(!m){
    m = raw.match(/(?:divided|shared|split|divide|share)\s+(\d+(?:\.\d+)?)[^\d]*(?:among|between|into)\s*(\d+(?:\.\d+)?)/);
  }
  if(m){
    var a1 = parseFloat(m[1]), b1 = parseFloat(m[2]);
    if(b1 > 0){
      var q = Math.round((a1 / b1)*1e10)/1e10;
      return {steps:a1+' ÷ '+b1+' = '+q, answer:q};
    }
  }

  if(/\b(each|per)\b/.test(raw) && nums.length >= 2){
    var p1 = nums[0], p2 = nums[1];
    var prod = Math.round(p1*p2*1e10)/1e10;
    return {steps:p1+' × '+p2+' = '+prod, answer:prod};
  }

  m = raw.match(/(\d+(?:\.\d+)?)\s*years?\s*(younger|older)/);
  if(m && nums.length >= 2){
    var age = nums[0];
    var diff = parseFloat(m[1]);
    var r = (m[2] === 'younger') ? age - diff : age + diff;
    var sym = (m[2] === 'younger') ? ' − ' : ' + ';
    return {steps:age+sym+diff+' = '+r, answer:r};
  }

  var costWord = /\b(costs?|cost|price|pays?|paid|shillings|dollars|ugx|ksh)\b/.test(raw);
  var giveWord = /\b(gives|gave|spends|spent|sold|used|lost|ate|eats)\b/.test(raw);
  var getWord  = /\b(gets|got|buys|bought|earned|receives|received|found|adds|added)\b/.test(raw);
  var remainQ  = /\b(remains?|left|remaining)\b/.test(raw);

  if(costWord && !giveWord && !getWord && nums.length >= 2){
    var c1 = nums[0], c2 = nums[1];
    var tot = Math.round(c1*c2*1e10)/1e10;
    return {steps:c1+' × '+c2+' = '+tot, answer:tot};
  }

  if(giveWord && !getWord && nums.length >= 2){
    var s1 = nums[0], s2 = nums[1];
    var sub = Math.round((s1-s2)*1e10)/1e10;
    return {steps:s1+' − '+s2+' = '+sub, answer:sub};
  }

  if(getWord && !giveWord && nums.length >= 2){
    var g1 = nums[0], g2 = nums[1];
    var add = Math.round((g1+g2)*1e10)/1e10;
    return {steps:g1+' + '+g2+' = '+add, answer:add};
  }

  if(giveWord && getWord && nums.length >= 3){
    var givePos = raw.search(/\b(gives|gave|spends|spent|sold|used|lost|ate|eats)\b/);
    var getPos  = raw.search(/\b(gets|got|buys|bought|earned|receives|received|found|adds|added)\b/);
    var res;
    if(givePos >= 0 && (getPos < 0 || givePos < getPos)){
      res = nums[0] - nums[1] + nums[2];
      return {steps:nums[0]+' − '+nums[1]+' + '+nums[2]+' = '+res, answer:res};
    } else {
      res = nums[0] + nums[1] - nums[2];
      return {steps:nums[0]+' + '+nums[1]+' − '+nums[2]+' = '+res, answer:res};
    }
  }

  if(nums.length === 2){
    if(remainQ){
      var r1 = nums[0]-nums[1];
      return {steps:nums[0]+' − '+nums[1]+' = '+r1, answer:r1};
    }
    if(/\b(total|altogether|in all)\b/.test(raw)){
      var r2 = nums[0]+nums[1];
      return {steps:nums[0]+' + '+nums[1]+' = '+r2, answer:r2};
    }
  }

  return null;
}

/* ============ VECTOR ENGINE ============ */
var VEC_DIM=192;
function hashWord(w){
  var h=2166136261;
  for(var i=0;i<w.length;i++){ h^=w.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function vec(text){
  var v=new Float32Array(VEC_DIM);
  var ws=sigWords(text);
  if(!ws.length) return v;
  for(var i=0;i<ws.length;i++){
    var w=ws[i];
    v[hashWord(w)%VEC_DIM]+=1.0;
    v[hashWord(w+'#b')%VEC_DIM]+=0.5;
    if(w.length>=4){
      for(var c=0;c<=w.length-3;c++){
        v[hashWord(w.substr(c,3)+'^')%VEC_DIM]+=0.25;
      }
    }
  }
  for(var i=0;i<ws.length-1;i++){
    v[hashWord(ws[i]+'_'+ws[i+1])%VEC_DIM]+=0.7;
  }
  var n=0;
  for(var i=0;i<VEC_DIM;i++) n+=v[i]*v[i];
  n=Math.sqrt(n);
  if(n>0) for(var i=0;i<VEC_DIM;i++) v[i]/=n;
  return v;
}
function cosine(a,b){
  var s=0;
  for(var i=0;i<a.length;i++) s+=a[i]*b[i];
  return s;
}

/* ============ MATCHING ============ */
var VEC_MIN=0.62;
function matchLearned(text){
  var t=norm(text);
  if(!t) return null;
  var tw=sigWords(text);
  if(!tw.length) return null;
  for(var i=0;i<learned.length;i++){
    if(norm(learned[i].q)===t) return learned[i];
  }
  for(var i=0;i<learned.length;i++){
    var qw=sigWords(learned[i].q);
    if(!qw.length) continue;
    var shortArr=tw.length<=qw.length?tw:qw;
    var longArr=tw.length<=qw.length?qw:tw;
    var missing=false;
    for(var k=0;k<shortArr.length;k++){
      if(longArr.indexOf(shortArr[k])<0){ missing=true; break; }
    }
    if(missing) continue;
    if(Math.abs(tw.length-qw.length)>2) continue;
    return learned[i];
  }
  if(learned.length){
    var qv=vec(text);
    var best=null, bs=0;
    for(var i=0;i<learned.length;i++){
      var lv=learned[i].v;
      if(!lv||lv.length!==VEC_DIM) continue;
      var sc=cosine(qv,lv);
      if(sc>bs){ bs=sc; best=learned[i]; }
    }
    if(best&&bs>=VEC_MIN) return best;
  }
  return null;
}
function matchRule(text){

  if(!t) return null;
  for(var i=0;i<RULES.length;i++){

      var key=norm(rule.k[j]);
      if(t===key || (' '+t+' ').indexOf(' '+key+' ')>=0){
        return rule.a[Math.floor(Math.random()*rule.a.length)];
      }
    }
  }
  return null;
}

  updateStatus();
}
function renderLearnedList(){
  var c=$('learnedList');
  if(!c) return;
  if(!learned.length){
    c.innerHTML='<div class="empty">No items learned yet.</div>';
    return;
  }
  var html='';
  for(var i=0;i<learned.length;i++){
    html+='<div class="item">'+
      '<div class="q">Q: '+esc(learned[i].q)+'</div>'+
      '<div class="a">A: '+esc(learned[i].a)+'</div>'+
      '<button class="del" data-i="'+i+'" type="button">🗑️ Delete</button>'+
      '</div>';
  }
  c.innerHTML=html;
  var btns=c.querySelectorAll('.del');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click',function(){
      var idx=parseInt(this.getAttribute('data-i'),10);
      if(idx>=0 && idx<learned.length){
        if(confirm('Delete this item?')){
          learned.splice(idx,1);
          saveLearned();
          updateStatus();
          renderLearnedList();
        }
      }
    });
  }
}
$('unlockBtn').addEventListener('click',function(){
  var v=($('pwd').value||'').trim();
  if(v===LEARN_PWD){
    learnUnlocked=true;
    try{ localStorage.setItem(UNLOCK_KEY,'1') }catch(e){}
    $('pwd').value='';
    $('lockMsg').textContent='';
    $('lockMsg').classList.remove('err');
    renderLearn();
  } else {
    $('lockMsg').textContent='❌ Wrong password';
    $('lockMsg').classList.add('err');
  }
});
$('pwd').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); $('unlockBtn').click(); }
});
$('lockBtn').addEventListener('click',function(){
  learnUnlocked=false;
  try{ localStorage.removeItem(UNLOCK_KEY) }catch(e){}
  renderLearn();
});
$('saveBtn').addEventListener('click',function(){
  var q=($('newQ').value||'').trim();
  var a=($('newA').value||'').trim();
  var m=$('saveMsg');
  if(!q||!a){ m.textContent='❌ Question and answer are required.'; m.classList.add('err'); return; }
  var qv=Array.prototype.slice.call(vec(q));
  var existing=null;
  for(var i=0;i<learned.length;i++){
    if(norm(learned[i].q)===norm(q)){ existing=learned[i]; break; }
  }
  if(existing){
    existing.a=a; existing.t=Date.now(); existing.v=qv;
    m.textContent='✅ Updated existing item.';
  } else {
    learned.push({id:nextId(),q:q,a:a,t:Date.now(),v:qv});
    m.textContent='✅ Saved. Ajon will remember this forever.';
  }
  m.classList.remove('err');
  saveLearned();
  updateStatus();
  $('newQ').value=''; $('newA').value='';
  renderLearnedList();
  setTimeout(function(){ m.textContent=''; }, 2500);
});
$('exportBtn').addEventListener('click',function(){
  var box=$('ioBox');
  box.style.display='block';
  $('doImportBtn').classList.add('hidden');
  if(!learned.length){ box.value='(nothing learned yet)'; return; }
  box.value=JSON.stringify(learned);
  box.select();
  try{ document.execCommand('copy'); }catch(e){}
  $('ioMsg').textContent='📤 Copied to clipboard. Send to another phone.';
});
$('importBtn').addEventListener('click',function(){
  var box=$('ioBox');
  box.style.display='block';
  box.value='';
  box.focus();
  $('doImportBtn').classList.remove('hidden');
  $('ioMsg').textContent='Paste the exported JSON above, then tap Confirm import.';
});
$('doImportBtn').addEventListener('click',function(){
  var json=($('ioBox').value||'').trim();
  var m=$('ioMsg');
  if(!json){ m.textContent='❌ Nothing to import.'; m.classList.add('err'); return; }
  try{
    var arr=JSON.parse(json);
    if(!Array.isArray(arr)) throw new Error('bad');
    var added=0, updated=0;
    for(var i=0;i<arr.length;i++){
      var it=arr[i];
      var q=(it&&(it.q||it[0]))||'';
      var a=(it&&(it.a||it[1]))||'';
      if(!q||!a) continue;
      var qv=Array.prototype.slice.call(vec(q));
      var found=false;
      for(var j=0;j<learned.length;j++){
        if(norm(learned[j].q)===norm(q)){
          learned[j].a=a; learned[j].t=Date.now(); learned[j].v=qv;
          updated++; found=true; break;
        }
      }
      if(!found){ learned.push({id:nextId(),q:q,a:a,t:Date.now(),v:qv}); added++; }
    }
    saveLearned();
    updateStatus();
    renderLearnedList();
    m.classList.remove('err');
    m.textContent='✅ Imported: '+added+' new, '+updated+' updated.';
    $('ioBox').value='';
    $('doImportBtn').classList.add('hidden');
  }catch(e){
    m.textContent='❌ Could not parse JSON.';
    m.classList.add('err');
  }
});

/* ============ CALCULATOR TAB ============ */
var calcExpr='';
function renderCalc(){
  var e=$('calcExpr'), r=$('calcResult');
  if(!e||!r) return;
  e.textContent=calcExpr||'0';
  if(!calcExpr){ r.textContent=''; return; }
  var result=calculate(calcExpr);
  r.textContent=(result===null)?'':String(result);
}
$('calcGrid').addEventListener('click',function(ev){
  var b=ev.target.closest('button');
  if(!b) return;
  var k=b.getAttribute('data-k');
  if(k==='C'){ calcExpr=''; }
  else if(k==='←'){ calcExpr=calcExpr.slice(0,-1); }
  else if(k==='='){
    var r=calculate(calcExpr);
    if(r!==null) calcExpr=String(r);
  }
  else { calcExpr+=k; }
  renderCalc();
});
renderCalc();

/* ============ REPLY ============ */
function reply(text){
  var raw=String(text||'').trim();
  if(!raw) return '';

  /* 1. simple math */
  var m=tryMath(raw);
  if(m) return '🔢 '+m.label+' = '+m.result;

  /* 2. WISDOM INTENTS FIRST — always work even if a learned item exists */
  var it=intent(raw);
  if(it==='story'){
    var s=findStory(raw) || STORIES[Math.floor(Math.random()*STORIES.length)];
    ctx.lastTopic=s.t; ctx.lastKind='story';
    return '📖 '+s.s+'\n\n💡 Moral: '+s.m;
  }
  if(it==='proverb'){
    var p=PROVERBS[Math.floor(Math.random()*PROVERBS.length)];
    ctx.lastTopic=p.p; ctx.lastKind='proverb';
    return '🦉 "'+p.p+'"\n\nMeaning: '+p.m;
  }
  if(it==='proverbMeaning'){
    var pm=findProverbMeaning(raw);
    if(pm) return '🦉 "'+pm.p+'"\n\nMeaning: '+pm.m;
  }
  if(it==='luganda'){
    var l=findLuganda(raw);
    if(l) return '🗣️ "'+l[0]+'" in Luganda is "'+l[1]+'"';
  }
  var dist=findDistrict(raw);
  if(dist) return '📍 '+dist+' is a district in Uganda.';

  /* 3. learned (exact → strict → vector) */
  var lm=matchLearned(raw);
  if(lm) return lm.a+'  💾';

  /* 4. word problem */
  var wp=solveWordProblem(raw);
  if(wp) return '🧮 '+wp.steps+'\n\n✅ Answer: '+wp.answer;

  /* 5. remember user's name */
  var newName=rememberUser(raw);
  if(newName) return 'Nice to meet you, '+newName+'! 😊 I will remember your name.';

  /* 6. conversation rules */
  var rm=matchRule(raw);
  if(rm) return rm;

  /* 7. facts */
  var fh=factsLookup(raw);
  if(fh) return '🧠 '+fh.a;

  /* 8. dictionary */
  var dh=dictLookup(raw);
  if(dh){
    var head=dh.typo?'📖 Did you mean "'+dh.word+'"?\n':'📖 ';
    var body=dh.word+': '+dh.def;
    if(dh.alt) body+='  (you said "'+dh.alt+'")';
    var tips=suggestFollowUps(dh.word);
    return head+body+(tips.length?'\n\n💡 '+tips.join(' · '):'');
  }

  /* 9. unknown */
  var hint=ctx.userName ? 'Sorry '+ctx.userName+', I do not know that yet 🤔' : 'Hmm, I do not know that one yet 🤔';
  return hint+'\n\nTry:\n'+
         '• "1+1" or "5 times 3"\n'+
         '• "John has 5 mangoes gives 2"\n'+
         '• "what is water"\n'+
         '• "tell me a story"\n'+
         '• "tell me a proverb"\n'+
         '• "how do you say water in luganda"\n'+
         '• "capital of uganda"\n\n'+
         '🔒 To teach me, unlock the 📚 Learn tab.';
}
